# Netlify build configuration (overrides the build settings in the Netlify UI).
[build]
  # Fetch content from Sanity, then build the Hugo site with the site's real URL.
  command = "npm run build -- --baseURL \"$URL/\""
  publish = "web/public"

[build.environment]
  NODE_VERSION = "22"
  HUGO_VERSION = "0.168.0"
  # Public, read-only Sanity dataset: no token needed.
  SANITY_PROJECT_ID = "9l9uv974"
  SANITY_DATASET = "production"

# Deploy previews and branch deploys use their own URL.
[context.deploy-preview]
  command = "npm run build -- --baseURL \"$DEPLOY_PRIME_URL/\""

[context.branch-deploy]
  command = "npm run build -- --baseURL \"$DEPLOY_PRIME_URL/\""

# CSS and JS filenames contain a content hash (Hugo fingerprinting), so they
# can be cached for a year: a change produces a new filename.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
