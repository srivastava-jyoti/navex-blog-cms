<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Description | default .Params.bio | default site.Params.description | plainify | truncate 160 }}">
{{- with resources.Get "scss/main.scss" }}
  {{- $css := . | css.Sass (dict "transpiler" "dartsass" "targetPath" "css/main.css" "outputStyle" "compressed") | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
{{- end }}
{{- with resources.Get "js/main.js" }}
  {{- $js := . | js.Build (dict "minify" true) | fingerprint }}
  <script src="{{ $js.RelPermalink }}" defer></script>
{{- end }}
