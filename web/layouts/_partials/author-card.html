{{- /* Author details. Params: author (term page), headingLevel (default 2). */ -}}
{{- $a := .author -}}
{{- $h := .headingLevel | default 2 -}}
<div class="author-card">
  {{ partial "avatar.html" (dict "author" $a "size" "lg") }}
  <div>
    <h{{ $h }} class="author-card__name"><a href="{{ $a.RelPermalink }}">{{ $a.Title }}</a></h{{ $h }}>
    {{- with $a.Params.bio }}<p class="author-card__bio">{{ . }}</p>{{ end }}
  </div>
</div>
