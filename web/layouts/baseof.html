<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {{ partial "header.html" . }}
    <main id="main" tabindex="-1">
      {{- /* Optional full-width area above the page content (used by blog posts). */}}
      {{ block "hero" . }}{{ end }}
      <div class="container page">
        {{ block "main" . }}{{ end }}
      </div>
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
