{{- /* Inline body image from Sanity. Params: src, alt, width, height. */ -}}
{{- with .Get "src" -}}
  <img class="post-image" src="{{ . }}?w=1200&amp;auto=format" alt="{{ $.Get "alt" }}" loading="lazy"
    {{- with $.Get "width" }} width="{{ . }}"{{ end }}{{ with $.Get "height" }} height="{{ . }}"{{ end }}>
{{- end -}}
