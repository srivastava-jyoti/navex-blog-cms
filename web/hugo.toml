baseURL = "https://example.netlify.app/" # overridden on Netlify via --baseURL / HUGO_BASEURL
locale = "en-gb"
title = "Navex Blog"
enableRobotsTXT = true
summaryLength = 30

[params]
  description = "Notes on content strategy, web development, accessibility and performance."

[taxonomies]
  category = "categories"
  author = "authors"

[permalinks.page]
  posts = "/posts/:slug/"

[markup.goldmark.renderer]
  unsafe = false # Content is Markdown generated from Portable Text; no raw HTML needed.

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false

[build]
  [build.buildStats]
    enable = false

[pagination]
  pagerSize = 9
