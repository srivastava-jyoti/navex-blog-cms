baseURL = "https://example.netlify.app/" # overridden on Netlify via --baseURL / HUGO_BASEURL
locale = "en-gb"
title = "Navex Blog"
enableRobotsTXT = true

[params]
  description = "Notes on content strategy, web development, accessibility and performance."

[taxonomies]
  category = "categories"
  author = "authors"

[permalinks.page]
  posts = "/posts/:slug/"

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2 # "In this article" lists main sections only
